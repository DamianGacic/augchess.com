services:
  - type: web
    name: augchess
    runtime: node
    plan: free
    rootDir: server
    # Server deps, then the Vite build of the site into ../dist.
    buildCommand: npm install && npm --prefix .. install --include=dev && npm --prefix .. run build
    startCommand: node index.js
    autoDeployTrigger: commit
    envVars:
      # Ranked games (server/ratings.js). The service role key is secret:
      # set it in the Render dashboard, never in this file.
      - key: SUPABASE_URL
        value: https://eosvuuqvzlibokvgtwnl.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
