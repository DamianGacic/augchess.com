<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AugChess</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- React root (src/main.jsx): header, home, leaderboards, settings,
         augments, figures, sign-in. The game screen and its modals below
         are still the classic scripts' static markup while they're ported. -->
    <div id="root"></div>

    <!-- Game View -->
    <div id="game-view" class="view hidden">
      <main>
        <div class="game-layout">

          <!-- Ability rail: sits in the board's row so it's level with the board
               itself (not the shorter player bars). Black's cluster hugs the top
               (next to Black's side), White's hugs the bottom (next to White's
               side) — reversed via flex order when the board is flipped. Each
               cluster is two single-file columns: A/S/D/F (global abilities,
               reserved for future non-unit augments) on the left, Q/W/E/R (unit
               abilities, tied to the piece that player currently has selected)
               right next to the board. -->
          <div class="ability-rail" id="ability-rail">
            <div class="ability-cluster" id="ability-panel-black">
              <div class="ability-column" id="ability-col-b-global">
                <div class="ability-slot empty" id="ability-slot-b-A" data-key="A"><span class="ability-key">A</span></div>
                <div class="ability-slot empty" id="ability-slot-b-S" data-key="S"><span class="ability-key">S</span></div>
                <div class="ability-slot empty" id="ability-slot-b-D" data-key="D"><span class="ability-key">D</span></div>
                <div class="ability-slot empty" id="ability-slot-b-F" data-key="F"><span class="ability-key">F</span></div>
              </div>
              <div class="ability-column" id="ability-col-b-unit">
                <div class="ability-slot empty" id="ability-slot-b-Q" data-key="Q"><span class="ability-key">Q</span></div>
                <div class="ability-slot empty" id="ability-slot-b-W" data-key="W"><span class="ability-key">W</span></div>
                <div class="ability-slot empty" id="ability-slot-b-E" data-key="E"><span class="ability-key">E</span></div>
                <div class="ability-slot empty" id="ability-slot-b-R" data-key="R"><span class="ability-key">R</span></div>
              </div>
            </div>
            <div class="ability-cluster" id="ability-panel-white">
              <div class="ability-column" id="ability-col-w-global">
                <div class="ability-slot empty" id="ability-slot-w-A" data-key="A"><span class="ability-key">A</span></div>
                <div class="ability-slot empty" id="ability-slot-w-S" data-key="S"><span class="ability-key">S</span></div>
                <div class="ability-slot empty" id="ability-slot-w-D" data-key="D"><span class="ability-key">D</span></div>
                <div class="ability-slot empty" id="ability-slot-w-F" data-key="F"><span class="ability-key">F</span></div>
              </div>
              <div class="ability-column" id="ability-col-w-unit">
                <div class="ability-slot empty" id="ability-slot-w-Q" data-key="Q"><span class="ability-key">Q</span></div>
                <div class="ability-slot empty" id="ability-slot-w-W" data-key="W"><span class="ability-key">W</span></div>
                <div class="ability-slot empty" id="ability-slot-w-E" data-key="E"><span class="ability-key">E</span></div>
                <div class="ability-slot empty" id="ability-slot-w-R" data-key="R"><span class="ability-key">R</span></div>
              </div>
            </div>
          </div>

          <!-- Black player info -->
          <div class="player-bar" id="player-black">
            <div class="player-info">
              <div class="player-avatar">♟</div>
              <div class="player-details">
                <span class="player-name">Black</span>
                <span class="player-rating">?</span>
              </div>
            </div>
            <div class="captured-pieces" id="captured-by-white"></div>
            <div class="clock" id="clock-black">—</div>
          </div>

          <!-- Chess Board -->
          <div class="board-wrapper">
            <div id="board"></div>
          </div>

          <!-- White player info -->
          <div class="player-bar" id="player-white">
            <div class="player-info">
              <div class="player-avatar">♙</div>
              <div class="player-details">
                <span class="player-name">White</span>
                <span class="player-rating">?</span>
              </div>
            </div>
            <div class="captured-pieces" id="captured-by-black"></div>
            <div class="clock" id="clock-white">—</div>
          </div>

          <!-- Side panel -->
          <div class="side-panel">
            <div class="status-box" id="status-box">
              <span id="status-text">White to move</span>
            </div>

            <div class="active-augments" id="active-augments">
              <div class="aa-header">Augments</div>
            </div>

            <div class="move-list-container">
              <div class="move-list-header">Moves</div>
              <div id="move-list" class="move-list"></div>
            </div>


            <div class="controls">
              <button class="btn btn-primary" id="btn-new-game">New Game</button>
              <button class="btn btn-secondary" id="btn-flip">Flip Board</button>
              <button class="btn btn-secondary" id="btn-3d">3D Board</button>
              <button class="btn btn-secondary" id="btn-undo">Undo</button>
              <button class="btn btn-secondary hidden" id="btn-forfeit">Forfeit</button>
              <button class="btn btn-secondary hidden" id="btn-draw">Offer Draw</button>
              <button class="btn btn-secondary hidden" id="btn-decline-draw">Decline Draw</button>
            </div>
            <div class="replay-bar hidden" id="replay-bar">
              <button class="btn btn-secondary" id="replay-first" aria-label="First move">⏮</button>
              <button class="btn btn-secondary" id="replay-prev" aria-label="Previous">◀</button>
              <span id="replay-pos"></span>
              <button class="btn btn-secondary" id="replay-next" aria-label="Next">▶</button>
              <button class="btn btn-secondary" id="replay-last" aria-label="Last move">⏭</button>
              <button class="btn btn-secondary" id="replay-exit">Back to History</button>
            </div>
          </div>

          <!-- Chat (chat.js) -->
          <div class="chat-container">
            <div class="move-list-header">Chat</div>
            <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
            <form id="chat-form" class="chat-form">
              <input id="chat-input" type="text" maxlength="300" autocomplete="off" aria-label="Chat message">
              <button class="btn btn-secondary" type="submit">Send</button>
            </form>
          </div>

        </div>
      </main>
    </div>

    <!-- Figure Detail Modal -->
    <div id="figure-detail-modal" class="modal hidden">
      <div class="modal-content figure-detail-content">
        <h3 id="figure-detail-title">Figure Name</h3>
        <div class="figure-detail-type" id="figure-detail-type">Replaces: Pawn</div>
        <img id="figure-detail-img" src="" alt="" class="figure-detail-img" />
        <p id="figure-detail-description">Figure description</p>
        <button class="btn btn-primary" id="close-figure-detail-btn">Close</button>
      </div>
    </div>

    <!-- Augment Detail Modal -->
    <div id="augment-detail-modal" class="modal hidden">
      <div class="modal-content augment-detail-content">
        <div class="detail-head">
          <img id="detail-icon" class="emblem detail-emblem" src="" alt="" />
          <div class="detail-titles">
            <h3 id="detail-title">Augment Name</h3>
            <div class="detail-meta" id="detail-meta"></div>
          </div>
        </div>
        <div class="augment-detail-cost" id="detail-cost">Cost: 1</div>
        <div class="detail-body">
          <div id="detail-demo" class="detail-demo"></div>
          <div class="detail-rules">
            <div class="aug-pop-label">How it works</div>
            <p id="detail-description">Augment description</p>
          </div>
        </div>
        <button class="btn btn-primary" id="close-detail-btn">Close</button>
      </div>
    </div>

  </div>

  <script src="chess.js"></script>
  <script src="data.js"></script>
  <script src="engine/draft-engine.js"></script>
  <script src="engine/chess-engine.js"></script>
  <script src="engine/gameover-engine.js"></script>
  <script src="engine/augments-engine.js"></script>
  <script src="engine/clock-engine.js"></script>
  <script src="engine/index.js"></script>
  <script src="engine/bot-engine.js"></script>
  <script src="netclient.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="settings.js"></script>
  <script src="auth.js"></script>
  <script src="stunlock.js"></script>
  <script src="shields.js"></script>
  <script src="abilities.js"></script>
  <script src="solarstrike.js"></script>
  <script src="clubbing.js"></script>
  <script src="silverbullet.js"></script>
  <script src="unstablefireball.js"></script>
  <script src="unstableteleport.js"></script>
  <script src="raisethedead.js"></script>
  <script src="clock.js"></script>
  <script src="augment-demos.js"></script>
  <script src="augment-demo-player.js"></script>
  <script src="board-anim.js"></script>
  <script src="vanguard.js"></script>
  <script src="views.js"></script>
  <script src="app.js"></script>
  <script src="ai-player.js"></script>
  <script src="chat.js"></script>
  <script type="module" src="board3d.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
